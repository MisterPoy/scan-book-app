<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <!-- PWA Meta Tags -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- App Info -->
    <title>Kodeks - Gestionnaire de Bibliothèque</title>
    <meta name="description" content="Application de gestion de bibliothèque personnelle avec scanner ISBN" />

    <!-- PWA Tags -->
    <meta name="theme-color" content="#3B82F6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kodeks" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("kodeks-theme-preference");
          const systemIsDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = preference === "dark" || (preference !== "light" && systemIsDark)
            ? "dark"
            : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            "content",
            theme === "dark" ? "#0B1120" : "#3B82F6",
          );
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
